projects:
  - name: RefriTrak — Multi-Tenant B2B SaaS Platform
    url: https://refritrak.com
    description: Production B2B SaaS platform for refrigerant-services field operations; founded and built end-to-end as sole engineer.
    tech: [Next.js 15, TypeScript, MongoDB, Prisma, Stripe, AWS S3, Anthropic Claude API, React Native, Expo SDK 54, Vercel, Vitest]
    tags: [saas, founder, ai, multi-tenant, full-stack, mobile, stripe, hipaa-adjacent]
    highlights:
      - Architected and shipped a production multi-tenant SaaS platform with role-based access control, public REST API, customer portal on a separate subdomain, and an internal admin tier — unified through a centralized authentication and authorization boundary supporting multiple credential types.
      - Built a domain-specific calculation engine paired with audit logging on all sensitive mutations, and Stripe-driven feature gating across free and paid subscription tiers.
      - Designed Next.js middleware for subdomain routing (customer portal, QR landing) layered with locale-prefixed internationalization, and integrated the Anthropic Claude API to power AI-assisted customer workflows.
      - Maintained a 1500+ unit test suite with integration tests against an in-memory database; enforced test-driven development for all business-critical logic.
      - Bulk document processing pipeline using AI for EPA compliance regulations using an agnostic node worker
      - Private npm AI tools library for maintaining AI tools and compliance workflows across apps and workers

  - name: Local-LLM Strategic AI for a Real-Time Strategy Engine
    description: Replaced a legacy game engine's strategic AI with calls to a locally-served LLM; includes custom C++ integration layer and QLoRA fine-tuning pipeline.
    tech: [C++, MFC, Win32, WinHTTP, Ollama, Python, QLoRA]
    tags: [ai, llm, c++, fine-tuning, local-llm, game-modding]
    highlights:
      - Wrote a non-blocking WinHTTP worker thread that serializes per-cycle battlefield snapshots to JSON, posts them to a local Ollama endpoint, and stores parsed strategy responses in a thread-safe shared advice store.
      - Implemented a constrained strategy menu and engine-side override systems to enforce real-time constraints and prevent degenerate model behavior.
      - Built a Python reward-scoring pipeline that converts per-game JSONL decision logs into 3,000+ scored training pairs, ready for QLoRA fine-tuning of a smaller real-time-capable model.

  - name: Self-Hosted Social Media Scheduler
    description: Flask + HTMX multi-platform social media scheduling system with state-machine pipeline and SQLite persistence.
    tech: [Python, Flask, HTMX, SQLite, APScheduler, Tweepy, atproto SDK, OpenCV, ffmpeg]
    tags: [automation, scheduling, python, flask, sqlite, social-media]
    highlights:
      - Built a modular blueprint architecture with multiple background tasks and a status-machine pipeline (ready → scheduled → posting → posted/failed → archived) using row-level claiming to prevent duplicate dispatches.
      - Migrated stateful configuration from JSON files into SQLite via idempotent migration scripts; authored a desktop-to-server publishing workflow over SFTP with per-platform syntax handling.

  - name: AI Chatbot Platform
    description: Monorepo-architecture streaming AI chatbot with multiple deployable services, shared internal packages, and comprehensive technical design documentation; currently in progress.
    tech: [pnpm, Turborepo, SvelteKit 2, Hono, BullMQ, Drizzle ORM, PostgreSQL, Docker]
    tags: [ai, chatbot, monorepo, streaming, llm, full-stack]
    highlights:
      - Designed a pnpm workspaces + Turborepo monorepo with multiple deployable services (web app, streaming chat service, content workers, admin CLI) and shared internal packages for authentication, billing, chat, content pipelines, database access, LLM orchestration, moderation, and storage.
      - Authored comprehensive technical design documentation covering system architecture, data schema, API contracts, streaming chat engine, content pipeline, pricing model, deployment topology, and testing strategy across a phased delivery roadmap.

  - name: Full Stack Dispatch & Fleet Management Application
    description: Freelance full-stack application for dispatch and fleet management operations.
    tech: [JavaScript, React, Node.js, REST API, MySQL]
    tags: [full-stack, fleet, dispatch, operations, freelance]
    highlights:
      - Built and delivered a full-stack dispatch and fleet management application as part of ongoing freelance work under MS Media LLC.

